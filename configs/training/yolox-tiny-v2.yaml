# Stage 8 experiment 3: yolox-tiny-v1 with a larger input, nothing else changed (same data,
# manifest, schedule, seed and augmentation). At 960 x 416 the dense LeftNear camera is shown
# at 0.66x and the far strata at 0.36-0.5x, and detection recall is 0.36 for fish under
# 0.02 m2 (docs/error_analysis.md). At 1280 x 640 LeftNear is at ~1.0x and the far strata at
# 0.56-0.67x, for ~2x the pixels per image. The checkpoint is chosen by counting nMAE on
# kenai-val, the same procedure as yolox-tiny-v1.
#
# Values here are planning choices, not tuned results. A changed value needs a new name.

name: yolox-tiny-v2
model_size: tiny
pretrained: yolox-tiny
input_height: 1280     # ~0.8 MP; both sides are multiples of the 32 px stride
input_width: 640
frame_stride: 3        # every 3rd frame: ~19,000 samples per epoch from 183 clips
batch_size: 16
epochs: 30
head_only_epochs: 1    # brief head-only phase, then full fine-tuning
lr_per_image: 0.00015625   # YOLOX default 0.01 / 64
backbone_lr_factor: 0.1    # backbone and neck learn 10x slower than the new head
warmup_epochs: 1.0
min_lr_ratio: 0.05
momentum: 0.9
weight_decay: 0.0005
max_labels: 64
num_workers: 4
seed: 0
amp: true              # CUDA only; ignored on CPU and MPS
log_every_iters: 50
checkpoint_every_iters: 500
augment:
  enabled: true
  flip_probability: 0.5
  contrast_range: [0.8, 1.2]
  brightness_range: [-15.0, 15.0]
  noise_probability: 0.3
  noise_sigma: 6.0
  blur_probability: 0.2
  blur_sigma: 0.8
