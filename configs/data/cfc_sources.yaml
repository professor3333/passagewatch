# Named download sets. `contains_test_locations` marks sets with clips from the official
# test locations (kenai-rightbank, kenai-channel, elwha, nushagak). Those clips must never
# be used for training, tuning, or hard-example mining.
bundles:
  tiny:
    description: >-
      Tiny development subset (up to 50 consecutive frames from up to 20 clips per
      location), plus the full MOT annotations, clip metadata, and the published ECCV22
      baseline tracking results used to validate the counting evaluator.
    contains_test_locations: true
    files:
      - 1y23m-j8r69/tiny_dataset.tar.gz
      - 1y23m-j8r69/fish_counting_annotations.tar.gz
      - 1y23m-j8r69/fish_counting_metadata.tar.gz
      - 1y23m-j8r69/fish_counting_results.tar.gz
  labels:
    description: Annotations, metadata, and baseline results only (no imagery).
    contains_test_locations: true
    files:
      - 1y23m-j8r69/fish_counting_annotations.tar.gz
      - 1y23m-j8r69/fish_counting_metadata.tar.gz
      - 1y23m-j8r69/fish_counting_results.tar.gz
  kenai-trainval:
    description: Kenai training and validation imagery (raw 1-channel) with v1.1 file lists.
    contains_test_locations: false
    files:
      - g945x-41103/kenai.tar
      - g945x-41103/file_lists_v1.1.zip
      - 1y23m-j8r69/fish_counting_annotations.tar.gz
      - 1y23m-j8r69/fish_counting_metadata.tar.gz
