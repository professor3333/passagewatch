# Development subset of the Kenai imagery (kenai.tar, ~44 GB), streamed so that only these
# clips are stored (~19 GB). See docs/dataset_card.md, "Kenai development subset".
#
# kenai-val is kept whole. kenai-train is kept by whole recording days, never by clip, so
# that day-grouped holdouts stay possible: every third training day, starting from the
# first. This keeps both cameras (LeftFar, LeftNear) and both the late-May and June
# periods, and about 36% of the training pixels.
#
# Changing this selection means a new name: extractions and manifests are keyed by it.

name: kenai-dev-v1
archive: g945x-41103/kenai.tar
member_prefix: kenai/
include:
  - location: kenai-val
  - location: kenai-train
    days: [2018-05-26, 2018-05-29, 2018-06-01, 2018-06-05, 2018-06-08]
