# Reference deployment on one CPU host: the API and one inference worker, from the same
# image, sharing the data volume (SQLite database, uploads, artifacts). Release bundles are
# mounted read-only from the host (PASSAGEWATCH_BUNDLES, default ./bundles); the active one
# is bundles/active. Model weights are never part of the image.
#
#   docker compose up -d --build        # then http://127.0.0.1:8000/health/ready
#
# A reverse proxy (HTTPS, frontend) and Prometheus are added in later stages.

name: passagewatch

# Hardening (docs/operations.md): a read-only root filesystem with only /data (volume) and
# /tmp (tmpfs) writable, no Linux capabilities, no privilege escalation, an init process
# for signal handling, memory limits from the measured profile, and bounded log files.
x-service: &service
  image: passagewatch:local
  build: .
  volumes:
    - data:/data
    - ${PASSAGEWATCH_BUNDLES:-./bundles}:/bundles:ro
  environment:
    PASSAGEWATCH_DEVICE: cpu
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  api:
    <<: *service
    command: ["api"]
    ports:
      - "127.0.0.1:${PASSAGEWATCH_HTTP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 3
    # Measured at about 0.14 GB while serving uploads and frames.
    mem_limit: 512m

  worker:
    <<: *service
    command: ["worker"]
    environment:
      PASSAGEWATCH_DEVICE: cpu
      # Set to the host's performance-core count (docs/operations.md); empty = PyTorch default.
      PASSAGEWATCH_TORCH_THREADS: ${PASSAGEWATCH_TORCH_THREADS:-}
    # Healthy while the worker heartbeats (idle or mid-job) after loading its model.
    healthcheck:
      test: ["CMD", "python", "-m", "passagewatch.service.worker.health"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 120s
    # Measured peak about 1.4 GB at the 6000-frame upload limit; the design budget is 4 GB.
    mem_limit: 3g
    # A job interrupted by shutdown is recovered by the next worker after its lease expires.
    stop_grace_period: 30s

volumes:
  data:
