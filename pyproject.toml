[project]
name = "passagewatch"
version = "0.1.0"
description = "Auditable fish-passage counting and review for sonar video"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.1",
    "opencv-python-headless>=4.10",
    "pyarrow>=17",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "torch>=2.5",
    "torchvision>=0.20",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest>=8.3",
    "ruff>=0.6",
    "scipy-stubs>=1.18.1.1",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/passagewatch"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Third-party code vendored unchanged or minimally changed (see its README).
extend-exclude = ["src/passagewatch/detection/yolox"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
# Calls into the vendored, untyped YOLOX code are allowed; everything else stays strict.
untyped_calls_exclude = ["passagewatch.detection.yolox"]

[[tool.mypy.overrides]]
module = "passagewatch.detection.yolox.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["torchvision", "torchvision.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests excluded from the default CI run",
]

# CI and Linux hosts get CPU-only PyTorch (the serving target is CPU); macOS uses the
# default wheels (CPU + MPS). GPU training hosts use their own CUDA PyTorch (docs/training.md).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
