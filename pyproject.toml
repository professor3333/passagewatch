[project]
name = "passagewatch"
version = "0.1.0"
description = "Auditable fish-passage counting and review for sonar video"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "opencv-python-headless>=4.10",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "scipy>=1.13",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest>=8.3",
    "ruff>=0.6",
    "scipy-stubs>=1.18.1.1",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/passagewatch"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests excluded from the default CI run",
]
