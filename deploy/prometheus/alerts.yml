# Alerts for the PassageWatch service (docs/operations.md, "Monitoring").
groups:
  - name: passagewatch
    rules:
      - alert: PassageWatchApiDown
        expr: up{job="api"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: The API has not answered Prometheus for 2 minutes.

      - alert: PassageWatchNoLiveWorker
        expr: passagewatch_live_workers == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: No worker of the active release has heartbeated for 2 minutes; jobs are not being processed.

      - alert: PassageWatchJobsFailing
        expr: >-
          max_over_time(passagewatch_jobs{status="failed"}[30m])
          - min_over_time(passagewatch_jobs{status="failed"}[30m]) > 0
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} job(s) failed in the last 30 minutes."

      - alert: PassageWatchQueueBacklog
        expr: passagewatch_oldest_queued_seconds > 1800
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: A job has waited more than 30 minutes for a worker.
