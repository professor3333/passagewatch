# Prometheus for the Compose deployment: scrapes the API (/metrics, from the database) and
# the worker (its own metrics port). Alert rules are in alerts.yml; firing alerts are shown
# at http://127.0.0.1:9090/alerts (no Alertmanager in this single-host deployment).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: worker
    static_configs:
      - targets: ["worker:9100"]
