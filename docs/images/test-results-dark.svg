<title id="title">Test results</title>
<desc id="desc">Count errors per 100 true passages at the four official CFC test locations and their macro average. elwha: PassageWatch 0.3.0 16.8, Tuned classical baseline 41.9, CFC Baseline (published) 32.3, CFC Baseline++ (published) 21.3. kenai-channel: PassageWatch 0.3.0 25.6, Tuned classical baseline 50.6, CFC Baseline (published) 53.0, CFC Baseline++ (published) 12.2. kenai-rightbank: PassageWatch 0.3.0 7.5, Tuned classical baseline 24.1, CFC Baseline (published) 11.8, CFC Baseline++ (published) 3.7. nushagak: PassageWatch 0.3.0 35.5, Tuned classical baseline 38.4, CFC Baseline (published) 14.0, CFC Baseline++ (published) 8.8. Macro average: PassageWatch 0.3.0 21.3, Tuned classical baseline 38.8, CFC Baseline (published) 27.8, CFC Baseline++ (published) 11.5.</desc>
<text x="30" y="40" font-size="24" fill="#f0f6fc" font-weight="700">Count errors per 100 true passages, official CFC test locations</text>
<text x="30" y="70" font-size="16" fill="#9198a1">Frozen release, evaluated once on 1,021 clips (5,296 passages) at locations never used for training or setting selection. Lower is better.</text>
