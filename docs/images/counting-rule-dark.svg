<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="318" viewBox="0 0 1140 318" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="title">How a track is counted</title>
<desc id="desc">Policy cfc-compatible-v1 counts a completed track by the side of the counting line where it starts and where it ends. Starting left and ending right counts one passage to the right; starting right and ending left counts one to the left. A track that crosses and comes back counts zero, not two, and a track that never crosses counts zero.</desc>
