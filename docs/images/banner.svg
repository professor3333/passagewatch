<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="title">PassageWatch</title>
<desc id="desc">Directional fish-passage counts from sonar video, with the evidence to check them. A stylized sonar view shows a tracked fish crossing the dashed counting line from left to right and being counted as one passage to the right.</desc>
