<radialGradient id="fanfill" cx="1010" cy="-250" r="560" gradientUnits="userSpaceOnUse"><stop offset="0.45" stop-color="#2a3442"/><stop offset="1" stop-color="#151c26"/></radialGradient>
<filter id="speckle" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.07 0.22" numOctaves="2" seed="11"/><feColorMatrix values="0 0 0 0 0.86  0 0 0 0 0.9  0 0 0 0 0.94  2.2 0 0 0 -1.05"/></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.4"/></filter>
<clipPath id="fan"><path d="M911.45 6.73 A275 275 0 0 0 1108.55 6.73 L1210.69 272.81 A560 560 0 0 1 809.31 272.81 Z"/></clipPath>
<clipPath id="card"><rect width="1280" height="320" rx="16"/></clipPath>
<linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f81f7"/><stop offset="1" stop-color="#1158c7"/></linearGradient>
