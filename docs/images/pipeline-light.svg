<svg xmlns="http://www.w3.org/2000/svg" width="1146" height="222" viewBox="0 0 1146 222" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="title">PassageWatch pipeline</title>
<desc id="desc">Sonar video, detection with YOLOX-Tiny on ONNX Runtime, Kalman tracking and counting by the start/end rule run automatically in one CPU worker; the technician then reviews a prioritized queue with random audits and exports CSV or JSON.</desc>
