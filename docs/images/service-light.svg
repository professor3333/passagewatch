<svg xmlns="http://www.w3.org/2000/svg" width="1146" height="400" viewBox="0 0 1146 400" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="title">PassageWatch service</title>
<desc id="desc">On one CPU host under Docker Compose: the browser review page talks to a FastAPI API; the API and one inference worker share SQLite in WAL mode (jobs, revisions, append-only reviews) and a media and artifacts volume. The worker leases one job at a time with heartbeats and loads a hash-checked release bundle once. Prometheus scrapes the API and the worker.</desc>
