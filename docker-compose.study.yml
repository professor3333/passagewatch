# The usability study's service (docs/usability_study.md): the release with the study pages,
# a long upload retention (the study clips must outlive all sessions) and its own project
# name, so its database and uploads are separate from any other deployment.
#
#   export PASSAGEWATCH_HTTP_PORT=8010
#   docker compose -p passagewatch-study -f docker-compose.yml -f docker-compose.study.yml \
#     up -d --build api worker
#   uv run python scripts/prepare_usability_study.py --url http://127.0.0.1:8010
#   open http://127.0.0.1:8010/#/study

# Merged into docker-compose.yml's settings (Compose merges environment and volumes by key).
x-study: &study
  PASSAGEWATCH_UPLOAD_RETENTION_HOURS: "2160"  # 90 days
  PASSAGEWATCH_STUDY_MODE: "true"
  PASSAGEWATCH_STUDY_PLAN: /study/plan.json

services:
  api:
    environment: *study
    volumes:
      - ./study:/study:ro
  worker:
    environment: *study
