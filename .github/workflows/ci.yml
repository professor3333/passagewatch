name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy src/ scripts/
      - name: Test
        run: uv run pytest -m "not slow"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend (type check, unit tests, build)
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Shell scripts
        run: shellcheck docker/entrypoint.sh scripts/compose_smoke_test.sh tools/kaggle/train_on_kaggle.sh tools/kaggle/evaluate_release_on_kaggle.sh
      - name: Container build
        run: docker compose build
      - name: Deployment smoke test (API + worker containers, random-weights bundle)
        run: ./scripts/compose_smoke_test.sh
