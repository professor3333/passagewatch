# Publish a release: on a release tag (passagewatch-<version>), check the release manifest,
# run the fast tests, build the service image and push it to GitHub's container registry,
# then publish its digest in a GitHub Release. The trained weights and evaluation data are
# not in git, so the counting evaluation and runtime parity are run locally and recorded in
# releases/manifests/<release>.json; scripts/check_release.py gates on that record. The
# digest is written into the manifest afterwards with scripts/record_image_digest.py and
# committed by the project owner, so no automation commits to the repository.
name: release

on:
  push:
    tags: ["passagewatch-*"]

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push the image to ghcr.io

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Environment
        run: uv sync --locked
      - name: Release gate (manifest, evaluation record, runtime parity)
        run: uv run python scripts/check_release.py --release "${GITHUB_REF_NAME}"
      - name: Fast tests
        run: uv run pytest -m "not slow" -q
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/passagewatch:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Publish the digest
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/passagewatch
        run: |
          echo "${DIGEST}" > image-digest.txt
          {
            echo "### ${GITHUB_REF_NAME}"
            echo "Image: \`${IMAGE}:${GITHUB_REF_NAME}\` (\`${DIGEST}\`)"
          } >> "${GITHUB_STEP_SUMMARY}"
          gh release create "${GITHUB_REF_NAME}" image-digest.txt \
            --title "${GITHUB_REF_NAME}" \
            --notes "Image \`${IMAGE}@${DIGEST}\`. Release manifest: \`releases/manifests/${GITHUB_REF_NAME}.json\`. Record the digest with \`scripts/record_image_digest.py --release ${GITHUB_REF_NAME} --digest ${DIGEST}\`."
